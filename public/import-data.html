<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品数据导入</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .card { background: white; border-radius: 12px; padding: 24px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { background: #ff7a00; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px; }
    .btn:hover { background: #e66e00; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .log { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; margin: 16px 0; }
    .log div { padding: 2px 0; }
    .log .success { color: #4ec9b0; }
    .log .error { color: #f44747; }
    .log .info { color: #569cd6; }
    .progress { background: #e0e0e0; border-radius: 8px; height: 20px; overflow: hidden; margin: 16px 0; }
    .progress-bar { background: #ff7a00; height: 100%; transition: width 0.3s; width: 0%; }
    .status { font-size: 18px; font-weight: bold; margin: 16px 0; }
    .ready { color: #107c10; }
    .warning { color: #d83b01; }
  </style>
</head>
<body>
  <h1>📦 产品数据导入工具</h1>
  <p>此页面用于将1153个产品从seed-data.json导入到Vercel生产环境数据库。</p>
  
  <div class="card">
    <h2>当前状态</h2>
    <div id="status" class="status">⏳ 等待检查...</div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText">点击"检查部署状态"开始</div>
  </div>

  <div class="card">
    <h2>导入选项</h2>
    <button id="checkDeploy" class="btn" onclick="checkDeployment()">🔍 检查部署状态</button>
    <button id="importAll" class="btn" onclick="importAll()">📥 一键导入全部1153个产品</button>
    <button id="importBatches" class="btn" onclick="importBatches()">📑 分批导入（12批）</button>
  </div>

  <div class="card">
    <h2>执行日志</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    const SECRET = 'Etruemart-2026-Secret-Key';
    const TOTAL_BATCHES = 12;

    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateProgress(percent, text) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').textContent = text;
    }

    async function checkDeployment() {
      log('正在检查API可用性...', 'info');
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          const data = await res.json();
          const count = Array.isArray(data) ? data.length : 'unknown';
          log(`✓ 产品API正常，当前数据库产品数: ${count}`, 'success');
          
          // Check import endpoint with POST
          try {
            const importRes = await fetch(`/api/import-all?secret=${SECRET}`, { method: 'POST' });
            if (importRes.ok || importRes.status === 400) {
              // 400 means the endpoint works but needs valid request
              log('✓ 新导入端点已部署', 'success');
              updateProgress(100, '✓ 准备就绪，可以开始导入');
              document.getElementById('status').textContent = '✓ 可以导入';
              document.getElementById('status').className = 'status ready';
            } else {
              log('⚠️ 导入端点可能未就绪，但按钮仍可尝试', 'warning');
              updateProgress(100, '⚠️ 端点可能未就绪');
              document.getElementById('status').textContent = '⚠️ 可能需要等待';
              document.getElementById('status').className = 'status warning';
            }
          } catch (e) {
            log('⚠️ 无法检查导入端点，但仍可尝试导入', 'warning');
            updateProgress(100, '⚠️ 无法检查');
            document.getElementById('status').textContent = '⚠️ 未知状态';
            document.getElementById('status').className = 'status warning';
          }
        } else {
          log('❌ 产品API请求失败', 'error');
        }
      } catch (e) {
        log('❌ 网络错误: ' + e.message, 'error');
      }
    }

    async function importAll() {
      if (!confirm('确定要导入全部1153个产品吗？这将清空现有产品数据！')) return;
      
      log('开始一键导入...', 'info');
      updateProgress(10, '正在导入...');
      
      try {
        const res = await fetch(`/api/import-all?secret=${SECRET}`, { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
          log(`✓ 导入成功！创建了 ${data.created} 个产品`, 'success');
          log(`总产品数: ${data.dbTotal}`, 'success');
          updateProgress(100, `✓ 完成！共 ${data.dbTotal} 个产品`);
          document.getElementById('status').textContent = '✓ 导入完成！';
          document.getElementById('status').className = 'status ready';
        } else {
          log('❌ 导入失败: ' + (data.error || '未知错误'), 'error');
        }
      } catch (e) {
        log('❌ 请求失败: ' + e.message, 'error');
        log('⚠️ Vercel可能超时，请使用分批导入方案', 'warning');
      }
    }

    async function importBatches() {
      if (!confirm('确定要分批导入吗？需要依次调用12次API。')) return;
      
      log('开始分批导入...', 'info');
      let totalCreated = 0;
      let totalErrors = 0;

      for (let i = 0; i < TOTAL_BATCHES; i++) {
        log(`正在导入第 ${i + 1}/${TOTAL_BATCHES} 批...`, 'info');
        updateProgress(Math.round((i / TOTAL_BATCHES) * 100), `正在导入第 ${i + 1} 批...`);
        
        try {
          const res = await fetch(`/api/import-seed?secret=${SECRET}&batch=${i}`, { method: 'POST' });
          const data = await res.json();
          
          if (data.success) {
            totalCreated += data.created || 0;
            totalErrors += data.errors || 0;
            log(`  ✓ 第 ${i + 1} 批: 创建 ${data.created} 个产品，数据库总计 ${data.dbTotal}`, 'success');
          } else {
            log(`  ❌ 第 ${i + 1} 批失败: ${data.error}`, 'error');
          }
        } catch (e) {
          log(`  ❌ 第 ${i + 1} 批请求失败: ${e.message}`, 'error');
          break;
        }
        
        await new Promise(r => setTimeout(r, 500));
      }
      
      log(`\n完成！总计创建 ${totalCreated} 个产品，错误 ${totalErrors} 个`, 'success');
      updateProgress(100, `✓ 完成！共导入 ${totalCreated} 个产品`);
      document.getElementById('status').textContent = `✓ 导入完成！共 ${totalCreated} 个产品`;
      document.getElementById('status').className = 'status ready';
    }
  </script>
</body>
</html>
